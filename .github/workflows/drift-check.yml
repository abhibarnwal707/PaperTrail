name: Drift check

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      simulate_drift:
        description: "Inject shifted payments to exercise the retrain loop"
        type: boolean
        default: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Check drift (and retrain + gate if the rule fires)
        run: python scripts/check_drift_and_retrain.py ${{ inputs.simulate_drift && '--simulate-drift' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: mlflow-audit-trail
          path: data/local/
