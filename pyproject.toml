[project]
name = "papertrail"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["polars>=1.0", "numpy", "scikit-learn", "xgboost", "shap", "mlflow", "dagshub"]

[project.optional-dependencies]
gnn   = ["torch"]
agent = ["langgraph", "langchain-core", "pydantic", "httpx"]
api   = ["fastapi", "uvicorn", "pydantic"]
app   = ["streamlit>=1.46", "plotly"]
dev   = ["pytest", "ruff", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend-exclude = ["notebooks"]   # Kaggle notebook cells are not linted

[tool.pytest.ini_options]
pythonpath = ["."]   # lets tests import the top-level `api` package when run as plain `pytest` (as CI does)
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/viz.py" = ["C408"]   # plotly layouts read better as dict(...)
