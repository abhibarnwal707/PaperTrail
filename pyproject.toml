[project]
name = "papertrail"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["polars>=1.0", "numpy", "scikit-learn", "xgboost", "shap", "mlflow", "dagshub"]

[project.optional-dependencies]
gnn   = ["torch"]
agent = ["langgraph", "langchain-core", "pydantic"]
api   = ["fastapi", "uvicorn"]
dev   = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
